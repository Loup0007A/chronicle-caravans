plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = 'com.chroniclecaravans'
base { archivesName = 'chroniclecaravans' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods {
        chroniclecaravans { sourceSet(sourceSets.main) }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '1000'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand 'version': project.version }
}

// chroniclecaravans-<version>-neoforge-1.21.1.jar
jar { archiveClassifier = project.target_name }

// Copies the compile classpath (to compile locally without access to the Maven repositories)
tasks.register('exportLibs', Copy) {
    from configurations.compileClasspath
    from(layout.buildDirectory.dir('moddev/artifacts'))
    into layout.buildDirectory.dir('export')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
